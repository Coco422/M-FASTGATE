services:
  m-fastgate:
    image: hub.szmckj.cn/miniai/m-fastgate:arm64-v0.3.0
    pull_policy: never
    container_name: m-fastgate
    working_dir: /app
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "8514:8514"
    volumes:
      # 数据库持久化 (宿主机:容器) - 使用bind mount
      - type: bind
        source: ${PWD}/data
        target: /app/data
      # 日志持久化 (宿主机:容器) - 使用bind mount
      - type: bind
        source: ${PWD}/logs
        target: /app/logs
      # 配置文件挂载 (宿主机:容器) - 使用bind mount
      - type: bind
        source: ${PWD}/config
        target: /app/config
        read_only: true
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    networks:
      - fastgate-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8514/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  fastgate-network:
    driver: bridge